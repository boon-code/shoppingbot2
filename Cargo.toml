[package]
name = "shoppingbot2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
pretty_env_logger = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = [
    "macros",
    "ctrlc_handler",
    "rustls",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "sync",
    "time",
] }
